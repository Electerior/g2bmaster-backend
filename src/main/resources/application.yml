spring:
  application:
    name: g2bmaster-backend

  # 접속 정보는 환경변수로만 주입한다. 기존 .env 의 PG* 를 MYSQL_* 로 옮긴 것.
  #
  # 시각은 전부 KST 다. connectionTimeZone 하나만으로는 부족하다 — 그것은 "서버가 이 시간대에
  # 있다"고 드라이버에 알려줄 뿐이라, 서버가 실제로 UTC 면 NOW(6) 는 UTC 를 돌려준다. 그러면
  # close_date(나라장터가 준 KST) 와 NOW(6) 를 비교하는 마감 전이·검색 필터가 9시간 어긋난다.
  # forceConnectionTimeZoneToSession 이 접속마다 SET time_zone 을 걸어 서버 설정과 무관하게
  # 세션을 KST 로 고정한다. DB 서버 TZ 에 기대지 않으므로 어느 환경에 올려도 같게 동작한다.
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:g2b}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:g2b}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${MYSQL_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 30000
      pool-name: g2b-pool

  jpa:
    # 스키마의 유일한 출처는 Flyway 다. Hibernate 는 절대 DDL 을 건드리지 않는다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          time_zone: Asia/Seoul
        order_inserts: true
        order_updates: true
        format_sql: false
    show-sql: false

  # 배경 작업 스레드. 기본값이 1이라 @Scheduled 가 전부 한 줄로 선다 — 색인 적재(조달청·D2B),
  # 마감 전이, 첨부 추출, 예약 tick 이 서로를 밀어낸다. 주기를 따로 준 뜻이 살려면 풀이 커야 한다.
  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:4}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    # Jackson 3(Spring Boot 4)에서 날짜 직렬화 옵션이 SerializationFeature 에서
    # DateTimeFeature 로 옮겨갔다. 옛 키(spring.jackson.serialization.*)를 그대로 두면
    # 바인딩이 실패해 **기동 자체가 안 된다** — 런타임에 조용히 무시되는 종류가 아니다.
    datatype:
      datetime:
        write-dates-as-timestamps: false

  servlet:
    multipart:
      # 첨부파일 업로드(공고 첨부·서약서 원본) 상한. 기존 multer 설정과 동일한 취지.
      max-file-size: 50MB
      max-request-size: 50MB

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${SMTP_SECURE:true}

server:
  port: ${PORT:8080}
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.electerior.g2bmaster: ${LOG_LEVEL:INFO}

# ── 애플리케이션 고유 설정 ────────────────────────────────────────────────
g2b:
  # 나라장터 OpenAPI
  openapi:
    service-key: ${G2B_SERVICE_KEY:}
    base-url: ${G2B_BASE_URL:https://apis.data.go.kr/1230000}
    timeout-ms: ${G2B_TIMEOUT_MS:20000}
    max-retries: ${G2B_MAX_RETRIES:3}
    page-size: ${G2B_PAGE_SIZE:100}

  # 국방전자조달(D2B) OpenAPI
  # 기본값이 공공데이터포털 게이트웨이인 이유: 구 직접 호출형(openapi.d2b.go.kr)은
  # data.go.kr 데이터셋이 전부 폐기(404)됐고 호스트도 WAF 400 만 돌려준다.
  # 현행 서비스는 apis.data.go.kr/1690000 경유 _GW 서비스다 — docs/d2b-openapi/INDEX.md ①.
  d2b:
    # 비어 있으면 조달청 키로 떨어진다. 같은 공공데이터포털 계정의 한 인증키가 조달청(1230000)과
    # 방위사업청(1690000) 양쪽에 승인돼 있어 그대로 통한다(실측: 조달청 키로 D2B
    # getDmstcCmpetBidPblancList → 200 NORMAL SERVICE). 기관별로 키를 따로 발급받았다면
    # D2B_SERVICE_KEY 를 주면 그쪽이 이긴다.
    #
    # 폴백을 두는 이유: 빈 키는 게이트웨이가 401 SERVICE_KEY_IS_NULL 로만 답해서 조용히 죽는다.
    # 적재는 출처별로 실패를 삼키고 나머지를 계속 넣으므로, D2B 만 며칠씩 안 들어오는 것을
    # 아무도 눈치채지 못한다(2026-08-11~14 실제로 그랬다).
    service-key: ${D2B_SERVICE_KEY:${G2B_SERVICE_KEY:}}
    base-url: ${D2B_BASE_URL:https://apis.data.go.kr/1690000}
    timeout-ms: ${D2B_TIMEOUT_MS:20000}

  # AI 저장소(g2bmaster-AI)로 넘기는 호출. 이 백엔드는 추론을 직접 하지 않는다.
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    # AI 서비스의 자체 데드라인보다 커야 하고(LLM_TIMEOUT_SECONDS, 기본 100초),
    # 분석 작업 리스(g2b.analysis.lease-ms)보다는 작아야 한다. 이 순서가 깨지면
    # 백엔드가 먼저 포기한 작업을 다른 워커가 다시 집어 LLM 비용이 두 배로 난다.
    timeout-ms: ${AI_TIMEOUT_MS:120000}
    enabled: ${AI_ENABLED:true}
    # AI 쪽 AI_SERVICE_SECRET 과 같은 값을 넣는다. 비워 두면 헤더를 붙이지 않는다
    # (AI 쪽도 비어 있어야 통과한다 — 한쪽만 설정하면 전부 401 이다).
    service-secret: ${AI_SERVICE_SECRET:}

  # CORS — 프론트가 별도 오리진에서 뜨므로 명시적으로 허용해야 한다.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # 앱 API 키. 비워두면 인증이 꺼진다(개발 모드) — AuthProperties 주석 참고.
  auth:
    app-api-key: ${APP_API_KEY:}

  # 운영/디버그 엔드포인트 보호용 공유 비밀값
  security:
    debug-secret: ${DEBUG_SECRET:}
    alert-secret: ${ALERT_SECRET:}

  # 알림 메일
  alert:
    from: ${SMTP_FROM:}
    to: ${ALERT_EMAIL:}
    keywords: ${ALERT_KEYWORDS:}
    public-base-url: ${PUBLIC_BASE_URL:}

  # 공고 검색 동작.
  # attachment-body: GET /api/search/notices 가 첨부 본문까지 보는가. 기본 켬 —
  # 첨부를 안 보는 검색이 필요하면 끄는 것이 아니라 GET /api/search/notices/text 를 쓴다.
  # 이 스위치는 색인이 커져 검색이 느려졌을 때 배포 없이 되돌리기 위한 비상 손잡이다.
  search:
    attachment-body: ${SEARCH_ATTACHMENT_BODY:true}

  # 동기화 스케줄러 — 기본은 꺼둔다(운영 인스턴스에서만 켠다).
  sync:
    enabled: ${SYNC_ENABLED:false}

  # 공고 검색 색인 적재기 — 나라장터를 주기적으로 훑어 bid_notice 에 쌓는다.
  # 검색(/api/search/notices)은 이 색인만 조회하므로, 여기가 꺼져 있으면 색인이 낡을 뿐
  # 검색 자체는 계속 동작한다(그래서 기본값을 꺼 둘 수 있다).
  # ⚠ 운영에서 이걸 켜는 인스턴스는 하나여야 한다 — 워터마크에 인스턴스 간 잠금이 없다.
  index:
    enabled: ${INDEX_SYNC_ENABLED:false}
    # 조달청 계열 5분 / D2B 30분. 쿼터가 오퍼레이션 단위이고 두 기관이 두 자릿수 배로 다르다 —
    # 조달청은 5분이면 오퍼레이션당 288회/일로 여유롭지만, D2B 개발계정은 하루 100건이라
    # 같은 값으로 두면 초과한다(30분 = 48회/일). D2B 를 운영계정으로 증량하면 같이 내리면 된다.
    interval-ms: ${INDEX_SYNC_INTERVAL_MS:300000}
    d2b-interval-ms: ${INDEX_D2B_INTERVAL_MS:1800000}
    sweep-ms: ${INDEX_SWEEP_INTERVAL_MS:300000}
    backfill-days: ${INDEX_BACKFILL_DAYS:7}
    # 심야에는 주기를 배수만큼 늘린다. 23~07시가 조달청 하루 물량의 0.7%(일 14건)뿐이라
    # 그 시간대의 촘촘한 폴링은 쿼터만 태운다. 5분→30분 / D2B 30분→3시간이 되고,
    # 오퍼레이션당 호출이 288→208회/일(조달청), 48→35회/일(D2B)로 줄어든다.
    # 게이팅을 끄려면 multiplier 를 1 로 두면 된다.
    night:
      from-hour: ${INDEX_NIGHT_FROM_HOUR:23}
      to-hour: ${INDEX_NIGHT_TO_HOUR:7}
      multiplier: ${INDEX_NIGHT_MULTIPLIER:6}

  # 첨부 본문 추출 워커. 색인 적재와 주기를 따로 둔다 — 적재는 HTTP 호출 수십 번이고
  # 추출은 하루 약 0.9GB 를 내려받는 일이라, 묶으면 전체가 무거운 쪽에 맞춰진다.
  # 기본은 꺼둔다: 여러 인스턴스가 같이 켜면 같은 파일을 중복으로 내려받는다.
  documents:
    enabled: ${DOCUMENT_EXTRACT_ENABLED:false}
    interval-ms: ${DOCUMENT_EXTRACT_INTERVAL_MS:1800000}
    batch-size: ${DOCUMENT_EXTRACT_BATCH:200}
    seed-batch: ${DOCUMENT_SEED_BATCH:500}
    concurrency: ${DOCUMENT_EXTRACT_CONCURRENCY:4}
    # 대상은 언제나 '최신 게시순 전량'이다. 범위를 자르는 손잡이를 두지 않는다 —
    # DOCUMENT_BACKFILL_CLOSE_BEFORE / DOCUMENT_BACKFILL_CREATED_BEFORE 는 제거됐다.
    # 절대 시각으로 창을 잡으면 그 창은 반드시 낡고, 창 밖에 쌓인 공고를 워커가 영영 못 집는다.

  # 분석 작업 큐. 큐 자체는 항상 살아 있고(등록·상태 조회는 언제나 동작한다),
  # 실제로 추론을 태우는 워커만 이 스위치로 켠다. 기본은 꺼둔다.
  # 여러 인스턴스에서 켜도 FOR UPDATE SKIP LOCKED 청구가 중복 실행을 막는다.
  analysis:
    runner-enabled: ${ANALYSIS_RUNNER_ENABLED:false}
    concurrency: ${ANALYSIS_CONCURRENCY:1}
    poll-ms: ${ANALYSIS_POLL_MS:500}
    lease-ms: ${ANALYSIS_LEASE_MS:300000}
    retry-base-ms: ${ANALYSIS_RETRY_BASE_MS:1000}
    # 비워 두는 것이 정상이다 — 프롬프트 버전은 AI 서비스의 /api/ai/prompt-version 에서 읽는다.
    # 여기에 값을 박으면 AI 쪽이 프롬프트를 고쳐도 백엔드가 낡은 결과를 계속 재사용한다.
    prompt-version: ${ANALYSIS_PROMPT_VERSION:}
