name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # 스키마가 실제로 적용되는지까지 봐야 의미가 있다 — Flyway 마이그레이션은
      # PostgreSQL 에서 옮겨온 것이라 "문법이 통과한다"는 보장이 없다.
      # 8.4 를 쓰는 이유: 생성 컬럼 기본값(8.0.13+)과 ON DUPLICATE KEY 행 별칭(8.0.19+)이
      # 필요하고, 개발 장비의 9.x 로만 검증하면 8.x 전용 차이를 놓친다.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: g2b
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: 단위 테스트
        run: ./mvnw -B test

      - name: 마이그레이션 파일명 검사
        run: |
          set -euo pipefail
          fail=0

          # ── 버전 중복 ────────────────────────────────────────────────────
          # 브랜치가 갈라진 채로 각자 번호를 잡으면, 머지되고 나서야 Flyway 가
          # "Found more than one migration with version N" 으로 기동을 막는다 —
          # 그때는 이미 main 이 깨져 있다. PR 단계에서 잡는다.
          # 버전은 파일명의 V 와 첫 `__` 사이 — 순번도 타임스탬프도 같은 규칙이다.
          dupes=$(for f in src/main/resources/db/migration/V*.sql; do
                    v=$(basename "$f"); v=${v#V}; echo "${v%%__*}"
                  done | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::마이그레이션 버전이 중복됐다: $(echo $dupes)"
            fail=1
          fi

          # ── 버전 형식 ────────────────────────────────────────────────────
          # 신규는 전부 14자리 타임스탬프다 — `./tools/new-migration.sh` 가 만들어 준다.
          # 순번 V1~V14 는 타임스탬프 전환 **이전**의 것이고 이 집합은 더 늘지 않는다.
          # 순번을 새로 잡는 순간 위의 중복 사고가 다시 시작되기 때문에, 여기서 막는다.
          for f in src/main/resources/db/migration/V*.sql; do
            b=$(basename "$f"); v=${b#V}; v=${v%%__*}
            case "$v" in
              [1-9]|1[0-4]) continue ;;
              20[0-9][0-9][0-1][0-9][0-3][0-9][0-2][0-9][0-5][0-9][0-5][0-9]) continue ;;
            esac
            echo "::error file=$f::버전 '$v' 는 14자리 타임스탬프가 아니다 — ./tools/new-migration.sh 로 만들 것"
            fail=1
          done

          exit $fail

      - name: 마이그레이션 적용 검증
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -P 3306 -uroot -proot \
            -e "ALTER DATABASE g2b CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
          # sort -V 가 필수다. 쉘 glob 은 사전순이라 V11 이 V1 보다 앞선다('1' < '_').
          # 그 순서로 돌면 V7 이 만드는 bid_notice 를 V11 이 먼저 ALTER 하려 들어
          # 첫 파일부터 죽는다. 번호가 한 자리뿐이던 시절에만 우연히 맞았다.
          for f in $(printf '%s\n' src/main/resources/db/migration/V*.sql | sort -V); do
            echo "적용: $f"
            mysql -h 127.0.0.1 -P 3306 -uroot -proot --default-character-set=utf8mb4 g2b < "$f"
          done
          count=$(mysql -h 127.0.0.1 -P 3306 -uroot -proot -N \
            -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='g2b'")
          echo "생성된 테이블: $count"
          # 테이블이 통째로 빠지면 조용히 줄어들 뿐 오류가 안 난다 — 하한을 박아 둔다.
          # 116 = V1~V14. 옛 값 114 는 V1~V6 기준이라 V7 의 bid_notice ·
          # bid_notice_sync_state 두 개를 세지 않고 있었다.
          # V11~V14 는 전부 ALTER 라 개수를 바꾸지 않는다 — 이 값은 CREATE/DROP TABLE 이
          # 오갈 때만 손댄다.
          test "$count" -ge 116

      - name: 패키징
        run: ./mvnw -B -DskipTests package
